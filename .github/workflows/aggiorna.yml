name: Aggiorna recensioni

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python aggiorna.py
      - name: Salva se cambiato
        run: |
          git config user.name "recensioni-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recensioni.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna recensioni Trustpilot"
            git push
          fi
